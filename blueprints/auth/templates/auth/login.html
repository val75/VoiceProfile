<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — VoiceProfile</title>
    <link rel="stylesheet" href="{{ url_for('auth.static', filename='auth/css/login.css') }}">
</head>
<body>
    <div class="card">
        <h1>Sign in</h1>
        <p class="subtitle">Enter your phone number and we'll send you a code to sign in or create an account.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
            <label>Phone number</label>
            <div class="phone-row">
                <input
                    type="tel"
                    id="countryCode"
                    placeholder="+1"
                    value="+1"
                    inputmode="tel"
                    maxlength="5"
                    autocomplete="tel-country-code"
                >
                <input
                    type="tel"
                    id="localNumber"
                    placeholder="555 000 0000"
                    inputmode="tel"
                    autocomplete="tel-national"
                    autofocus
                    required
                >
            </div>
            <input type="hidden" name="phone" id="phone">
            <p class="hint">We'll send a 6-digit code to this number.</p>

            <label class="consent">
                <input type="checkbox" name="sms_consent" value="yes" required>
                <span>
                    I agree to receive SMS verification codes from ShareGud at the number
                    above. Msg &amp; data rates may apply. See our
                    <a href="{{ url_for('terms') }}" target="_blank" rel="noopener">Terms</a>
                    and
                    <a href="{{ url_for('privacy') }}" target="_blank" rel="noopener">Privacy&nbsp;Policy</a>.
                </span>
            </label>

            <button type="submit">Send code</button>
        </form>
        <script>
        document.getElementById('loginForm').addEventListener('submit', function () {
            var cc    = document.getElementById('countryCode').value.trim();
            var local = document.getElementById('localNumber').value.replace(/\s+/g, '').trim();
            document.getElementById('phone').value = cc + local;
        });
        </script>
    </div>
</body>
</html>
