<!-- One button that always shows the next step: Record → Stop → Transcribe -->
<div class="controls" id="controls">
    <button id="recordBtn" type="button" data-state="idle">
        <span id="recordIcon" class="record-icon" aria-hidden="true"></span>
        <span id="recordLabel">Record</span>
    </button>
    <button id="againBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        <span>Record again</span>
    </button>
</div>
