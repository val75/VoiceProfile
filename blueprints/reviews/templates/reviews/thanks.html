<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted</title>
    <link rel="stylesheet" href="{{ url_for('reviews.static', filename='reviews/css/reviews.css') }}">
</head>
<body>
    <div class="container" style="text-align:center;padding-top:60px">
        <div class="thanks-icon">🌟</div>
        <h1 class="thanks-title">Thank you!</h1>
        <p class="thanks-sub">Your review of {{ profile.name }} has been submitted.</p>
        <a href="{{ url_for('reviews.public_profile', profile_id=profile.id) }}" class="btn-primary">
            View profile
        </a>
    </div>
</body>
</html>
